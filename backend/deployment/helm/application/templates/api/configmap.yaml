{{- if .Values.api.environment }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "application.fullname" . }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.api.environment }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

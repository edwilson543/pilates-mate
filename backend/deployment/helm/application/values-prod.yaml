# Production-specific values.
# Applied on top of values.yaml for production installations.

image:
  repository: "127624060144.dkr.ecr.eu-west-2.amazonaws.com/pilates"
  tag: "latest"

api:
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# -- Expose the service via gateway-api HTTPRoute
httpRoute:
  enabled: true
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  hostnames:
  - chart-example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers

# Spread pods across zones and nodes for resilience when running multiple replicas.
# Docs: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

suite: test api deployment
templates:
  - templates/api/deployment.yaml
tests:
  - it: should render the deployment with default values
    asserts:
      - isKind:
          of: Deployment
      - matchSnapshot:
          path: spec

  - it: should inject envFrom and checksum annotation when environment and secrets are set
    set:
      api:
        environment:
          FOO: bar
        secrets:
          SECRET_KEY: changeme
    asserts:
      - isNotNull:
          path: spec.template.metadata.annotations["checksum/config"]
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-pilates
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: RELEASE-NAME-pilates

  - it: should set replicas when autoscaling is disabled
    set:
      api:
        autoscaling:
          enabled: false
    asserts:
      - equal:
          path: spec.replicas
          value: 1
